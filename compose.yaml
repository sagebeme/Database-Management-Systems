# The four course databases in Docker, as an alternative to tools/devdb.sh. Same versions and settings as CI,
# on the same ports, so the tests find them without a .env:
#
#   docker compose up -d      start them (the first time downloads the images, about 1.5 GB)
#   docker compose ps         are they running?
#   docker compose down       stop them (add -v to delete their data too)
#
# You still need the command-line clients (mysql, psql 17, mongosh, redis-cli) where you run the tests:
# see "Setting up" in README.md, or WINDOWS.md. No passwords: every port is bound to 127.0.0.1 only.
name: dbms-course

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    command:
      - --local-infile=ON
      - --log-bin-trust-function-creators=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports: ["127.0.0.1:${MYSQL_PORT:-3307}:3306"]
    volumes: [mysql:/var/lib/mysql]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
    ports: ["127.0.0.1:${PGPORT:-5434}:5432"]
    volumes: [postgres:/var/lib/postgresql/data]

  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:${MONGO_PORT:-27018}:27017"]
    volumes: [mongo:/data/db]

  redis:
    image: redis:8.0
    ports: ["127.0.0.1:${REDIS_PORT:-6380}:6379"]

volumes:
  mysql:
  postgres:
  mongo:
