<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="400" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="matatu-schema-title matatu-schema-desc" id="schema-root">
      <title id="matatu-schema-title">Matatu bookings: the schema</title>
      <desc id="matatu-schema-desc">Three PostgreSQL tables: routes keyed by route number, trips on a route with a seat count, and bookings of one seat on one trip, unique per trip and seat.</desc>
