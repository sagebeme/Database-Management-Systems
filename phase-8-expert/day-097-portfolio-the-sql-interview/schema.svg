      <title id="interview-schema-title">The ride-hailing tables</title>
      <desc id="interview-schema-desc">Three tables for the SQL interview: riders, who may have been referred by another rider; drivers with a county and vehicle; and trips joining a rider to a driver with fare, status, payment and an optional rating.</desc>
