# Proves the course still works on every push and pull request: every solution passes its
# tests against a real database, and every untouched starter fails them.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A missing database fails the tests instead of skipping them.
      DBMS_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the Python packages
        run: pip install -r requirements.txt

      # The same server settings tools/devdb.sh uses, on the same port.
      - name: Start MySQL 8.4
        run: |
          docker run -d --name mysql -p 3307:3306 -e MYSQL_ALLOW_EMPTY_PASSWORD=yes mysql:8.4 \
            --local-infile=ON --log-bin-trust-function-creators=ON \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
          for i in $(seq 1 60); do
            mysqladmin --no-defaults -h127.0.0.1 -P3307 -uroot ping 2>/dev/null && exit 0
            sleep 2
          done
          docker logs mysql
          exit 1

      # The other three databases, also on the ports tools/devdb.sh uses. No passwords: they only listen on
      # the runner itself.
      - name: Start PostgreSQL 17, MongoDB 7 and Redis 8
        run: |
          docker run -d --name postgres -p 5434:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_INITDB_ARGS='--locale=C.UTF-8 --encoding=UTF8' postgres:17
          docker run -d --name mongo -p 27018:27017 mongo:7.0
          docker run -d --name redis -p 6380:6379 redis:8.0
          for i in $(seq 1 60); do
            pg_isready -h 127.0.0.1 -p 5434 -U postgres -q && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1

      # psql is on the runner already; mongosh isn't.
      - name: Install mongosh
        run: |
          npm install --global --silent mongosh@2.5.2
          for i in $(seq 1 30); do
            mongosh --quiet --port 27018 --eval 'db.runCommand({ping: 1}).ok' && exit 0
            sleep 2
          done
          exit 1

      - name: Solutions pass, starters fail
        run: python tools/verify.py

      # verify.py only names the failing tests; this shows why, for the first few.
      - name: Show the first failures in detail
        if: failure()
        run: DBMS_TARGET=solution python -m pytest -q --tb=short --maxfail=8 -p no:cacheprovider phase-*/
